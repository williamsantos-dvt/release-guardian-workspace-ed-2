schema: spec-driven

context: |
  Release Guardian — servico de release readiness para pipelines CI/CD.
  Monorepo npm workspaces: apps/api (Fastify), apps/dashboard (React/Vite),
  packages/contracts (fonte unica de tipos e JSON Schemas), scripts/, examples/.
  Motor de decisao: apps/api/src/services/releaseService.ts (evaluateRelease).
  Invariantes obrigatorios da policy: ver seccao "Invariantes da Release Policy"
  em AGENTS.md. Investigacao do baseline: docs/investigation/01-findings.md.
  Gate de readiness: npm run validate.
  O contrato request/response de POST /api/v1/evaluations e imutavel.
  Proibido alterar apps/dashboard/** e scripts/simulate-pipeline.cjs.

rules:
  proposal:
    - Indicar explicitamente que seeds mudam de decisao e o novo byDecision
  spec:
    - Cada requisito tem de ser verificavel por um teste nomeado
    - Cobrir sempre o caso de precedencia NO_GO sobre REVIEW
  tasks:
    - Separar a extracao do literal 70 para MINIMUM_COVERAGE numa task propria
    - Incluir uma task de recalculo do snapshot em api.test.ts:103
